<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        
        body {
            background: transparent;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .goal-wrapper {
            color: white;
            font-size: 60px;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.2); /* Leichtes Background-Panel für bessere Lesbarkeit */
            padding: 10px 20px;
            border-radius: 15px;
        }

        .current { 
            color: #00FFCC; 
            transition: all 0.5s ease;
        }

        .divider { 
            opacity: 0.6; 
            margin: 0 15px; 
            font-weight: 300;
        }

        .total { 
            color: #ffffff; 
        }

        /* Kleiner Effekt, wenn die Zahl sich ändert */
        .pulse {
            animation: pulse-animation 0.5s ease-out;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); color: #fff; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="goal-wrapper">
        <span id="current" class="current">0</span>
        <span class="divider">/</span>
        <span id="total" class="total">100</span>
    </div>

    <script>
        // Name wurde auf nyoorx angepasst
        const twitchUser = 'nyoorx'; 
        const goalAmount = 100;
        let lastCount = 0;

        async function updateFollowers() {
            try {
                // Nutzt Decapi für den Follower-Count
                const response = await fetch(`https://decapi.me/twitch/followcount/${twitchUser}`);
                if (!response.ok) throw new Error('Netzwerk-Fehler');
                
                const count = await response.text();
                const currentElem = document.getElementById('current');
                
                // Animation abspielen, wenn sich die Zahl ändert
                if (count !== lastCount) {
                    currentElem.classList.remove('pulse');
                    void currentElem.offsetWidth; // Trigger Reflow
                    currentElem.classList.add('pulse');
                    lastCount = count;
                }

                currentElem.innerText = count.trim();
                document.getElementById('total').innerText = goalAmount;
            } catch (e) {
                console.log("Fehler beim Laden der Follower:", e);
            }
        }

        // Alle 20 Sekunden aktualisieren (etwas schneller als vorher)
        setInterval(updateFollowers, 20000);
        updateFollowers();
    </script>
</body>
</html>
